  </radialGradient>
  <rect width="400" height="225" fill="url(#vig4)"/>

  <!-- Grid -->
  <g stroke="#20242c" stroke-width="0.7" opacity="1">
    <line x1="0" y1="30" x2="400" y2="30"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="33" y1="0" x2="33" y2="225"/>
    <line x1="66" y1="0" x2="66" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="225"/>
    <line x1="133" y1="0" x2="133" y2="225"/>
    <line x1="166" y1="0" x2="166" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="233" y1="0" x2="233" y2="225"/>
    <line x1="266" y1="0" x2="266" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="225"/>
    <line x1="333" y1="0" x2="333" y2="225"/>
    <line x1="366" y1="0" x2="366" y2="225"/>
  </g>

  <!-- Lens arcs -->
  <g stroke="#181c24" stroke-width="1.2" fill="none" opacity="0.6">
    <ellipse cx="200" cy="112" rx="65" ry="38"/>
    <ellipse cx="200" cy="112" rx="125" ry="70"/>
    <ellipse cx="200" cy="112" rx="188" ry="104"/>
  </g>

  <!-- Entrance canopy/awning suggestion -->
  <g opacity="0.22">
    <rect x="100" y="70" width="200" height="20" fill="#1e2229"/>
    <line x1="100" y1="90" x2="80" y2="130" stroke="#2a2e38" stroke-width="1"/>
    <line x1="150" y1="90" x2="150" y2="130" stroke="#2a2e38" stroke-width="1"/>
    <line x1="200" y1="90" x2="200" y2="130" stroke="#2a2e38" stroke-width="1"/>
    <line x1="250" y1="90" x2="250" y2="130" stroke="#2a2e38" stroke-width="1"/>
    <line x1="300" y1="90" x2="320" y2="130" stroke="#2a2e38" stroke-width="1"/>
    <rect x="0" y="155" width="400" height="5" fill="#1e2229"/>
  </g>

  <!-- PTZ crosshair -->
  <g stroke="#b07000" stroke-width="0.8" opacity="0.35">
    <line x1="182" y1="112" x2="218" y2="112"/>
    <line x1="200" y1="94" x2="200" y2="130"/>
    <circle cx="200" cy="112" r="12" fill="none"/>
  </g>

  <!-- Timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  08:01:17</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <text x="394" y="30" font-family="monospace" font-size="9" fill="#556070" text-anchor="end">CH 7</text>

  <!-- Camera icon -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#b07000" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">BOA PLAZA  901 MAIN ST  MAIN ENTRANCE</text>
