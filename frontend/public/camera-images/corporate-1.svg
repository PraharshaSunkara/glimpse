<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background -->
  <rect width="400" height="225" fill="#0e1118"/>

  <!-- Vignette -->
  <radialGradient id="vig3" cx="50%" cy="50%" r="65%">
    <stop offset="50%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig3)"/>

  <!-- Grid -->
  <g stroke="#22262f" stroke-width="0.7" opacity="1">
    <line x1="0" y1="25" x2="400" y2="25"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="175" x2="400" y2="175"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="225"/>
    <line x1="80" y1="0" x2="80" y2="225"/>
    <line x1="120" y1="0" x2="120" y2="225"/>
    <line x1="160" y1="0" x2="160" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="225"/>
    <line x1="280" y1="0" x2="280" y2="225"/>
    <line x1="320" y1="0" x2="320" y2="225"/>
    <line x1="360" y1="0" x2="360" y2="225"/>
  </g>

  <!-- Lens arcs -->
  <g stroke="#1c2028" stroke-width="1" fill="none" opacity="0.65">
    <ellipse cx="200" cy="112" rx="75" ry="42"/>
    <ellipse cx="200" cy="112" rx="145" ry="80"/>
    <ellipse cx="200" cy="112" rx="195" ry="108"/>
  </g>

  <!-- Building lobby suggestion: tall glass facade lines -->
  <g opacity="0.2">
    <rect x="80" y="10" width="240" height="180" fill="#14171f"/>
    <!-- Vertical mullions -->
    <line x1="110" y1="10" x2="110" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <line x1="145" y1="10" x2="145" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <line x1="180" y1="10" x2="180" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <line x1="215" y1="10" x2="215" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <line x1="250" y1="10" x2="250" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <line x1="285" y1="10" x2="285" y2="190" stroke="#2a2e38" stroke-width="1"/>
    <!-- Horizontal spandrels -->
    <line x1="80" y1="55" x2="320" y2="55" stroke="#2a2e38" stroke-width="1"/>
    <line x1="80" y1="100" x2="320" y2="100" stroke="#2a2e38" stroke-width="1"/>
    <line x1="80" y1="145" x2="320" y2="145" stroke="#2a2e38" stroke-width="1"/>
  </g>

  <!-- Subtle amber tint — corporate color -->
  <rect width="400" height="225" fill="#3d2800" opacity="0.04"/>

  <!-- PTZ crosshair -->
  <g stroke="#b07000" stroke-width="0.8" opacity="0.4">
    <line x1="185" y1="112" x2="215" y2="112"/>
    <line x1="200" y1="97" x2="200" y2="127"/>
    <circle cx="200" cy="112" r="10" fill="none"/>
  </g>

  <!-- Timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  07:58:02</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <!-- Channel ID -->
  <text x="394" y="30" font-family="monospace" font-size="9" fill="#556070" text-anchor="end">CH 4</text>

  <!-- Camera icon -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#b07000" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">FOUNTAIN PLACE  1445 ROSS AVE  LOBBY EXT</text>
</svg>
