<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background — slightly warmer for hotel feel -->
  <rect width="400" height="225" fill="#100f0e"/>

  <!-- Vignette -->
  <radialGradient id="vig5" cx="52%" cy="48%" r="66%">
    <stop offset="45%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.88"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig5)"/>

  <!-- Grid -->
  <g stroke="#232220" stroke-width="0.7" opacity="1">
    <line x1="0" y1="25" x2="400" y2="25"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="175" x2="400" y2="175"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="44" y1="0" x2="44" y2="225"/>
    <line x1="89" y1="0" x2="89" y2="225"/>
    <line x1="133" y1="0" x2="133" y2="225"/>
    <line x1="178" y1="0" x2="178" y2="225"/>
    <line x1="222" y1="0" x2="222" y2="225"/>
    <line x1="267" y1="0" x2="267" y2="225"/>
    <line x1="311" y1="0" x2="311" y2="225"/>
    <line x1="356" y1="0" x2="356" y2="225"/>
  </g>

  <!-- Lens arcs -->
  <g stroke="#201e1c" stroke-width="1" fill="none" opacity="0.7">
    <ellipse cx="200" cy="112" rx="80" ry="45"/>
    <ellipse cx="200" cy="112" rx="150" ry="83"/>
    <ellipse cx="200" cy="112" rx="192" ry="106"/>
  </g>

  <!-- Hotel valet / entrance suggestion -->
  <g opacity="0.2">
    <!-- Drive-through canopy -->
    <rect x="50" y="50" width="300" height="125" fill="#17151200"/>
    <line x1="50" y1="80" x2="350" y2="80" stroke="#2e2b28" stroke-width="2"/>
    <line x1="100" y1="80" x2="100" y2="175" stroke="#2e2b28" stroke-width="1.5"/>
    <line x1="300" y1="80" x2="300" y2="175" stroke="#2e2b28" stroke-width="1.5"/>
    <!-- Cars suggestion (simple rectangles) -->
    <rect x="130" y="130" width="55" height="28" rx="3" fill="#1e1c1a"/>
    <rect x="220" y="130" width="55" height="28" rx="3" fill="#1e1c1a"/>
  </g>

  <!-- Warm amber tint -->
  <rect width="400" height="225" fill="#2a1800" opacity="0.06"/>

  <!-- PTZ crosshair -->
  <g stroke="#b07000" stroke-width="0.8" opacity="0.4">
    <line x1="185" y1="112" x2="215" y2="112"/>
    <line x1="200" y1="97" x2="200" y2="127"/>
    <circle cx="200" cy="112" r="9" fill="none"/>
  </g>

  <!-- Timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  08:03:44</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <text x="394" y="30" font-family="monospace" font-size="9" fill="#556070" text-anchor="end">CH 2</text>

  <!-- Camera icon -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#b07000" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#b07000" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">THE JOULE HOTEL  1530 MAIN ST  EXT SOUTH</text>
</svg>
