<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background — slightly warmer/noisier for bar/venue feel -->
  <rect width="400" height="225" fill="#0f0c10"/>

  <!-- Vignette -->
  <radialGradient id="vig7" cx="50%" cy="50%" r="68%">
    <stop offset="48%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig7)"/>

  <!-- Grid -->
  <g stroke="#201e22" stroke-width="0.7" opacity="1">
    <line x1="0" y1="28" x2="400" y2="28"/>
    <line x1="0" y1="56" x2="400" y2="56"/>
    <line x1="0" y1="84" x2="400" y2="84"/>
    <line x1="0" y1="112" x2="400" y2="112"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="168" x2="400" y2="168"/>
    <line x1="0" y1="196" x2="400" y2="196"/>
    <line x1="44" y1="0" x2="44" y2="225"/>
    <line x1="89" y1="0" x2="89" y2="225"/>
    <line x1="133" y1="0" x2="133" y2="225"/>
    <line x1="178" y1="0" x2="178" y2="225"/>
    <line x1="222" y1="0" x2="222" y2="225"/>
    <line x1="267" y1="0" x2="267" y2="225"/>
    <line x1="311" y1="0" x2="311" y2="225"/>
    <line x1="356" y1="0" x2="356" y2="225"/>
  </g>

  <!-- Lens arcs -->
  <g stroke="#1c181e" stroke-width="1" fill="none" opacity="0.6">
    <ellipse cx="200" cy="112" rx="72" ry="42"/>
    <ellipse cx="200" cy="112" rx="138" ry="78"/>
    <ellipse cx="200" cy="112" rx="190" y2="107" rx="190" ry="107"/>
  </g>

  <!-- Bar/venue entrance scene: brick wall texture + awning + crowd suggestion -->
  <g opacity="0.18">
    <!-- Brick pattern rows -->
    <rect x="0" y="30" width="400" height="150" fill="#130f14"/>
    <g stroke="#1a161c" stroke-width="0.5">
      <line x1="0" y1="45" x2="400" y2="45"/>
      <line x1="0" y1="60" x2="400" y2="60"/>
      <line x1="0" y1="75" x2="400" y2="75"/>
      <line x1="0" y1="90" x2="400" y2="90"/>
      <line x1="0" y1="105" x2="400" y2="105"/>
      <line x1="0" y1="120" x2="400" y2="120"/>
      <line x1="0" y1="135" x2="400" y2="135"/>
      <line x1="0" y1="150" x2="400" y2="150"/>
      <line x1="0" y1="165" x2="400" y2="165"/>
    </g>
    <!-- Venue entrance door -->
    <rect x="160" y="95" width="80" height="85" rx="1" fill="#0e0b0f"/>
    <!-- Awning -->
    <polygon points="130,70 270,70 290,95 110,95" fill="#1a1520"/>
    <!-- Neon sign glow -->
    <rect x="155" y="35" width="90" height="22" rx="3" fill="#1a0820" opacity="0.8"/>
    <text x="200" y="50" font-family="monospace" font-size="9" fill="#6600aa" text-anchor="middle" opacity="0.7">TREES</text>
  </g>

  <!-- Subtle purple tint -->
  <rect width="400" height="225" fill="#1a0030" opacity="0.06"/>

  <!-- Timestamp — slightly later hour for bar cam -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  00:47:22</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <!-- Camera icon — purple for bar/restaurant -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#6b3fa0" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">TREES  2709 ELM ST  FRONT ENTRANCE  DEEP ELLUM</text>
</svg>
