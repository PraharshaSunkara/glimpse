<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background -->
  <rect width="400" height="225" fill="#0c0a0e"/>

  <!-- Vignette — heavier corners for bar cam -->
  <radialGradient id="vig8" cx="50%" cy="50%" r="65%">
    <stop offset="42%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig8)"/>

  <!-- Grid -->
  <g stroke="#1d1b20" stroke-width="0.7" opacity="1">
    <line x1="0" y1="25" x2="400" y2="25"/>
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="125" x2="400" y2="125"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="175" x2="400" y2="175"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="40" y1="0" x2="40" y2="225"/>
    <line x1="80" y1="0" x2="80" y2="225"/>
    <line x1="120" y1="0" x2="120" y2="225"/>
    <line x1="160" y1="0" x2="160" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="225"/>
    <line x1="280" y1="0" x2="280" y2="225"/>
    <line x1="320" y1="0" x2="320" y2="225"/>
    <line x1="360" y1="0" x2="360" y2="225"/>
  </g>

  <!-- Lens arcs — slightly off-center (camera mounted at angle) -->
  <g stroke="#17141a" stroke-width="1" fill="none" opacity="0.65">
    <ellipse cx="190" cy="115" rx="68" ry="40"/>
    <ellipse cx="190" cy="115" rx="130" ry="74"/>
    <ellipse cx="190" cy="115" rx="188" ry="105"/>
  </g>

  <!-- Adair's Saloon scene: dive bar exterior, Canton St -->
  <g opacity="0.2">
    <rect x="0" y="40" width="400" height="160" fill="#0e0b0f"/>
    <!-- Facade sign board -->
    <rect x="80" y="42" width="240" height="35" rx="2" fill="#150e12"/>
    <text x="200" y="64" font-family="monospace" font-size="11" fill="#440022" text-anchor="middle" opacity="0.65">ADAIR'S SALOON</text>
    <!-- Windows -->
    <rect x="90" y="85" width="70" height="55" rx="1" fill="#110d13"/>
    <rect x="240" y="85" width="70" height="55" rx="1" fill="#110d13"/>
    <!-- Door -->
    <rect x="170" y="100" width="60" height="100" rx="1" fill="#0b090d"/>
    <!-- Sidewalk -->
    <rect x="0" y="185" width="400" height="20" fill="#131016"/>
    <!-- Outdoor patio railing -->
    <line x1="0" y1="185" x2="120" y2="185" stroke="#1e1a22" stroke-width="1.5"/>
    <line x1="40" y1="155" x2="40" y2="185" stroke="#1e1a22" stroke-width="1"/>
    <line x1="80" y1="155" x2="80" y2="185" stroke="#1e1a22" stroke-width="1"/>
    <line x1="120" y1="155" x2="120" y2="185" stroke="#1e1a22" stroke-width="1"/>
  </g>

  <!-- Very slight purple tint -->
  <rect width="400" height="225" fill="#150020" opacity="0.07"/>

  <!-- Late night timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  01:12:58</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <!-- Camera icon -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#6b3fa0" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#6b3fa0" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">ADAIR'S SALOON  2624 COMMERCE ST  EXTERIOR</text>
</svg>
