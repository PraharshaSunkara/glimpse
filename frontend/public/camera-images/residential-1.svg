<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background — slightly cooler/darker for residential night feel -->
  <rect width="400" height="225" fill="#0a0d0f"/>

  <!-- Vignette — stronger for residential doorbell cam feel -->
  <radialGradient id="vig6" cx="50%" cy="50%" r="60%">
    <stop offset="40%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig6)"/>

  <!-- Grid — finer for wide-angle doorbell cam -->
  <g stroke="#181c20" stroke-width="0.6" opacity="1">
    <line x1="0" y1="22" x2="400" y2="22"/>
    <line x1="0" y1="45" x2="400" y2="45"/>
    <line x1="0" y1="67" x2="400" y2="67"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="112" x2="400" y2="112"/>
    <line x1="0" y1="135" x2="400" y2="135"/>
    <line x1="0" y1="157" x2="400" y2="157"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="202" x2="400" y2="202"/>
    <line x1="28" y1="0" x2="28" y2="225"/>
    <line x1="57" y1="0" x2="57" y2="225"/>
    <line x1="85" y1="0" x2="85" y2="225"/>
    <line x1="114" y1="0" x2="114" y2="225"/>
    <line x1="142" y1="0" x2="142" y2="225"/>
    <line x1="171" y1="0" x2="171" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="228" y1="0" x2="228" y2="225"/>
    <line x1="257" y1="0" x2="257" y2="225"/>
    <line x1="285" y1="0" x2="285" y2="225"/>
    <line x1="314" y1="0" x2="314" y2="225"/>
    <line x1="342" y1="0" x2="342" y2="225"/>
    <line x1="371" y1="0" x2="371" y2="225"/>
  </g>

  <!-- Wide-angle barrel distortion arcs (more pronounced for doorbell cam) -->
  <g stroke="#141820" stroke-width="1.2" fill="none" opacity="0.65">
    <ellipse cx="200" cy="112" rx="55" ry="32"/>
    <ellipse cx="200" cy="112" rx="110" ry="62"/>
    <ellipse cx="200" cy="112" rx="165" ry="92"/>
    <ellipse cx="200" cy="112" rx="200" ry="110"/>
  </g>

  <!-- Porch / front door scene suggestion -->
  <g opacity="0.2">
    <!-- Door -->
    <rect x="165" y="55" width="70" height="120" rx="2" fill="#131518"/>
    <rect x="165" y="55" width="70" height="2" fill="#1e2228"/>
    <!-- Door handle -->
    <circle cx="225" cy="118" r="3" fill="#2a2e38"/>
    <!-- Steps -->
    <rect x="145" y="175" width="110" height="8" rx="1" fill="#181b20"/>
    <rect x="135" y="183" width="130" height="8" rx="1" fill="#181b20"/>
    <!-- Porch light (faint glow) -->
    <circle cx="200" cy="50" r="8" fill="#2a2820" opacity="0.6"/>
    <circle cx="200" cy="50" r="4" fill="#3d3828" opacity="0.4"/>
  </g>

  <!-- Subtle green tint (night vision) -->
  <rect width="400" height="225" fill="#002200" opacity="0.08"/>

  <!-- Timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  02:31:09</text>

  <!-- No REC on residential — just motion indicator -->
  <text x="340" y="13" font-family="monospace" font-size="9" fill="#cc8800">MOTION</text>

  <!-- Camera icon — green for residential -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#2d6a2d" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#2d6a2d" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#2d6a2d" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">RESIDENCE  2814 ELM ST  FRONT PORCH</text>
</svg>
