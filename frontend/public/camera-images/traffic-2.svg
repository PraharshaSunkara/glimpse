<svg xmlns="http://www.w3.org/2000/svg" width="400" height="225" viewBox="0 0 400 225">
  <!-- Background -->
  <rect width="400" height="225" fill="#0c1014"/>

  <!-- Vignette -->
  <radialGradient id="vig2" cx="50%" cy="50%" r="70%">
    <stop offset="55%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vig2)"/>

  <!-- Grid lines - horizontal -->
  <g stroke="#252830" stroke-width="0.8" opacity="0.9">
    <line x1="0" y1="32" x2="400" y2="32"/>
    <line x1="0" y1="64" x2="400" y2="64"/>
    <line x1="0" y1="96" x2="400" y2="96"/>
    <line x1="0" y1="128" x2="400" y2="128"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="192" x2="400" y2="192"/>
  </g>
  <!-- Grid lines - vertical -->
  <g stroke="#252830" stroke-width="0.8" opacity="0.9">
    <line x1="50" y1="0" x2="50" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="225"/>
    <line x1="150" y1="0" x2="150" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="250" y1="0" x2="250" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="225"/>
    <line x1="350" y1="0" x2="350" y2="225"/>
  </g>

  <!-- Lens distortion arcs -->
  <g stroke="#1a1e26" stroke-width="1.2" fill="none" opacity="0.6">
    <ellipse cx="200" cy="112" rx="70" ry="40"/>
    <ellipse cx="200" cy="112" rx="130" ry="72"/>
    <ellipse cx="200" cy="112" rx="185" ry="100"/>
  </g>

  <!-- Road suggestion - Commerce/Griffin intersection -->
  <g opacity="0.25">
    <rect x="170" y="0" width="60" height="225" fill="#191c22"/>
    <rect x="0" y="90" width="400" height="45" fill="#191c22"/>
    <rect x="197" y="20" width="6" height="10" fill="#333740" rx="1"/>
    <rect x="197" y="42" width="6" height="10" fill="#333740" rx="1"/>
    <rect x="197" y="155" width="6" height="10" fill="#333740" rx="1"/>
    <rect x="197" y="177" width="6" height="10" fill="#333740" rx="1"/>
  </g>

  <!-- Slight green tint overlay (night vision feel) -->
  <rect width="400" height="225" fill="#003300" opacity="0.05"/>

  <!-- Timestamp -->
  <rect x="0" y="0" width="180" height="18" fill="#000000" opacity="0.5"/>
  <text x="6" y="13" font-family="monospace" font-size="10" fill="#00cc44">2026-03-29  08:14:51</text>

  <!-- REC -->
  <circle cx="370" cy="10" r="5" fill="#cc2200"/>
  <text x="378" y="14" font-family="monospace" font-size="9" fill="#cc2200">REC</text>

  <!-- Camera icon -->
  <g transform="translate(8, 195)">
    <rect x="0" y="4" width="20" height="14" rx="2" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
    <polygon points="20,7 26,4 26,18 20,15" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
    <circle cx="9" cy="11" r="3" fill="none" stroke="#4a90d9" stroke-width="1.2"/>
  </g>

  <!-- Location label -->
  <rect x="0" y="207" width="400" height="18" fill="#000000" opacity="0.65"/>
  <text x="200" y="220" font-family="monospace" font-size="10" fill="#c8d0dc" text-anchor="middle">CAM-02  COMMERCE ST &amp; GRIFFIN ST  DTX</text>
</svg>
